name: Create Pre-Release

on:
  workflow_run:
    workflows: ["Build Example Applications Pi (ARM64)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.4.8)'
        required: true
      sha:
        description: 'Commit SHA that both build workflows ran against'
        required: true

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download ARM64 .deb artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p debs

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HEAD_SHA=$(gh api "repos/$REPO/commits/${{ inputs.sha }}" --jq '.sha')
            WF_ID=$(gh api "repos/$REPO/actions/workflows" \
              --jq '.workflows[] | select(.name == "Build Example Applications Pi (ARM64)") | .id')
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/$WF_ID/runs?head_sha=$HEAD_SHA&per_page=10" \
              --jq '.workflow_runs[0].id')
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi

          gh run download "$RUN_ID" --repo "$REPO" \
            --name led-cube-exampleapplications-arm64 \
            --dir debs/

      - name: Download AMD64 .deb artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.sha')

          WF_ID=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.name == "Build Example Applications (AMD64)") | .id')

          RUN_ID=$(gh api "repos/$REPO/actions/workflows/$WF_ID/runs?head_sha=$HEAD_SHA&per_page=10" \
            --jq '.workflow_runs[0].id')

          gh run download "$RUN_ID" --repo "$REPO" \
            --name led-cube-exampleapplications-amd64 \
            --dir debs/

          echo "Downloaded packages:"
          find debs/ -name "*.deb" | sort

      - name: Stage .deb files for upload
        run: mv debs/*.deb .

      - name: Upload to APT Repository
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.UPLOAD_HOST }}
          username: ${{ vars.UPLOAD_USER }}
          key: ${{ secrets.UPLOAD_SSH_KEY }}
          source: "*.deb"
          target: "/docker/apt-repo/data/incoming/"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          DEB_FILES=$(find debs/ -name "*.deb" | tr '\n' ' ')

          LATEST_RELEASE=$(gh release view --repo "${{ github.repository }}" \
            --json tagName -q .tagName 2>/dev/null || echo "")

          NOTES_FLAG=""
          if [ -n "$LATEST_RELEASE" ]; then
            NOTES_FLAG="--notes-start-tag $LATEST_RELEASE"
          fi

          gh release create "$TAG" $DEB_FILES \
            --repo "${{ github.repository }}" \
            --prerelease \
            --generate-notes \
            $NOTES_FLAG \
            --title "Release $TAG" || \
          gh release upload "$TAG" $DEB_FILES \
            --repo "${{ github.repository }}" --clobber
