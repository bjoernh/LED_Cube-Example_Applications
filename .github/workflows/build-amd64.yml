name: Build Example Applications (AMD64)

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build and Package (AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Tag Matches CMake Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PROJECT_VERSION=$(grep -oP 'project\([^ ]+ VERSION \K[0-9.]+' CMakeLists.txt)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          TAG_BASE_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)
          if [ "$PROJECT_VERSION" != "$TAG_BASE_VERSION" ]; then
            echo "::error::CMake project version ($PROJECT_VERSION) does not match Git tag version ($TAG_BASE_VERSION)!"
            exit 1
          fi
          echo "Version match verified: $PROJECT_VERSION"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git pkg-config \
            libeigen3-dev libboost-all-dev libasound2-dev \
            libprotobuf-dev protobuf-compiler libimlib2-dev

      - name: Build and Install matrixserver from submodule
        run: |
          cd matrixserver
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../install ..
          make -j$(nproc)
          make install

      - name: Build Example Applications
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Create Debian Package Workspace
        run: |
          PROJECT_VERSION=$(grep -oP 'project\([^ ]+ VERSION \K[0-9.]+' CMakeLists.txt)
          if [ -z "$PROJECT_VERSION" ]; then echo "Failed to extract version"; exit 1; fi

          mkdir -p deb-workspace/opt/cube/bin
          cp bin/cubetestapp  deb-workspace/opt/cube/bin/
          cp bin/Genetic      deb-workspace/opt/cube/bin/
          cp bin/Breakout3D   deb-workspace/opt/cube/bin/
          cp bin/Blackout3D   deb-workspace/opt/cube/bin/
          cp bin/PixelFlow3   deb-workspace/opt/cube/bin/
          cp bin/MatrixRain   deb-workspace/opt/cube/bin/
          cp bin/Snake        deb-workspace/opt/cube/bin/
          cp bin/Picture      deb-workspace/opt/cube/bin/
          cp bin/imutestapp   deb-workspace/opt/cube/bin/
          cp bin/PixelFlow    deb-workspace/opt/cube/bin/
          cp bin/PixelFlow2   deb-workspace/opt/cube/bin/
          cp bin/Rainbow      deb-workspace/opt/cube/bin/

          mkdir -p deb-workspace/usr/local/lib
          cp matrixserver/install/lib/libmatrixapplication.so deb-workspace/usr/local/lib/

          mkdir -p deb-workspace/DEBIAN
          cat <<EOF > deb-workspace/DEBIAN/control
          Package: led-cube-exampleapplications
          Version: ${PROJECT_VERSION}
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: Bjoern Hauffe<oss@64b.de>
          Description: LEDCube matrixserver example applications (AMD64/Simulator)
          Depends: libboost-thread1.83.0, libboost-log1.83.0, libboost-system1.83.0, libboost-regex1.83.0, libboost-chrono1.83.0, libboost-date-time1.83.0, libboost-filesystem1.83.0, libboost-atomic1.83.0, libboost-program-options1.83.0, libasound2t64, libprotobuf32t64, libimlib2t64
          EOF

          cat <<'EOF' > deb-workspace/DEBIAN/postinst
          #!/bin/sh
          ldconfig
          EOF
          chmod 755 deb-workspace/DEBIAN/postinst

      - name: Build Debian Package
        run: |
          PROJECT_VERSION=$(grep -oP 'project\([^ ]+ VERSION \K[0-9.]+' CMakeLists.txt)
          dpkg-deb --build deb-workspace "led-cube-exampleapplications_${PROJECT_VERSION}_amd64.deb"

      - name: Upload Debian Package Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: led-cube-exampleapplications-amd64
          path: led-cube-exampleapplications_*_amd64.deb
